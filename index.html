<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹툰 서재 & 랜덤 룰렛</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg-color: #f3f4f6;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--surface);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
        }

        h1, h2 {
            margin-bottom: 16px;
            color: var(--text-main);
        }

        h1 { font-size: 1.5rem; text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 16px; }
        h2 { font-size: 1.25rem; display: flex; justify-content: space-between; align-items: center; }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="number"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .row > .form-group { flex: 1; min-width: 200px; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        
        button.danger { background-color: var(--danger); }
        button.danger:hover { background-color: var(--danger-hover); }
        button.btn-small { padding: 6px 12px; font-size: 0.875rem; }

        .list-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:nth-child(even) { background-color: #f9fafb; }

        .item-info { display: flex; flex-direction: column; gap: 4px; }
        .item-title { font-weight: bold; font-size: 1.1rem; }
        .item-meta { font-size: 0.875rem; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }
        
        .badge {
            background-color: #e5e7eb;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #374151;
        }

        .roulette-box {
            background-color: #fef3c7;
            border: 2px dashed #f59e0b;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            margin-top: 16px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .roulette-title { font-size: 1.75rem; font-weight: bold; color: #d97706; margin: 8px 0; }
        .roulette-meta { font-size: 1.1rem; color: #92400e; }

    </style>
</head>
<body>

<div class="container">
    <h1>📚 내 웹툰 서재 & 랜덤 추천기</h1>

    <div class="card">
        <h2>1. 웹툰 불러오기</h2>
        <div class="row">
            <div class="form-group">
                <label for="platform">플랫폼 선택</label>
                <select id="platform">
                    <option value="레진코믹스">레진코믹스</option>
                    <option value="봄툰">봄툰</option>
                    <option value="리디">리디</option>
                    <option value="네이버웹툰">네이버웹툰</option>
                </select>
            </div>
            <div class="form-group">
                <label for="minPercent">소장률 기준 (%)</label>
                <input type="number" id="minPercent" value="0" min="0" max="100">
            </div>
        </div>
        <div class="form-group">
            <label for="htmlData">HTML 코드 붙여넣기 (개발자 도구에서 복사)</label>
            <textarea id="htmlData" placeholder="이곳에 복사한 HTML 코드를 붙여넣으세요..."></textarea>
        </div>
        <button onclick="parseHTML()">서재에 추가하기</button>
    </div>

    <div class="card">
        <h2>2. 랜덤 정주행 룰렛 🎲</h2>
        <div class="row" style="align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0;">
                <label for="filterPlatform">추천받을 플랫폼</label>
                <select id="filterPlatform">
                    <option value="전체">전체 플랫폼</option>
                    <option value="레진코믹스">레진코믹스</option>
                    <option value="봄툰">봄툰</option>
                    <option value="리디">리디</option>
                    <option value="네이버웹툰">네이버웹툰</option>
                </select>
            </div>
            <button onclick="spinRoulette()" style="background-color: #8b5cf6;">랜덤 픽!</button>
        </div>
        <div id="rouletteResult" class="roulette-box">
            <div style="color: var(--text-muted);">버튼을 눌러 운명의 작품을 뽑아보세요!</div>
        </div>
    </div>

    <div class="card">
        <h2>
            <span>3. 내 서재 리스트 (<span id="totalCount">0</span>)</span>
            <button class="danger btn-small" onclick="clearAll()">전체 초기화</button>
        </h2>
        <div class="list-container" id="libraryList">
            <!-- 자바스크립트로 리스트 항목이 여기에 렌더링됩니다 -->
        </div>
    </div>
</div>

<script>
    let library = [];

    function init() {
        const stored = localStorage.getItem('webtoonLib');
        if (stored) {
            try {
                library = JSON.parse(stored);
            } catch (e) {
                library = [];
            }
        }
        renderList();
    }

    function saveToStorage() {
        localStorage.setItem('webtoonLib', JSON.stringify(library));
    }

    function parseHTML() {
        const rawHTML = document.getElementById('htmlData').value.trim();
        const platform = document.getElementById('platform').value;
        const threshold = parseInt(document.getElementById('minPercent').value, 10) || 0;

        if (!rawHTML) {
            alert('HTML 코드를 입력해주세요.');
            return;
        }

        // DOMParser를 이용한 파싱
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawHTML, 'text/html');
        
        // .hy__info 클래스를 가진 모든 요소 찾기
        const items = doc.querySelectorAll('.hy__info');
        
        if (items.length === 0) {
            alert('입력된 HTML에서 작품 정보를 찾을 수 없습니다.');
            return;
        }

        let added = 0;
        let skipped = 0;

        items.forEach(item => {
            // 1. 제목 추출 로직
            const titleEl = item.querySelector('.hy__infoTitle');
            let title = '제목 없음';
            
            if (titleEl) {
                // 노드를 복제하여 원본 훼손 방지
                const clonedEl = titleEl.cloneNode(true);
                // 내부에 있는 span, i 태그(뱃지 등) 모두 제거
                const badges = clonedEl.querySelectorAll('span, i');
                badges.forEach(badge => badge.remove());
                
                // 순수 텍스트만 가져오기
                title = clonedEl.textContent.trim();
            }

            // 2. 소장률 추출 로직
            const progressSpan = item.querySelector('.hy__infoProgress span');
            let percent = 0;
            
            if (progressSpan) {
                // 정규식을 사용해 숫자만 추출 (예: "98%" -> "98")
                const match = progressSpan.textContent.match(/(\d+)%/);
                if (match) {
                    percent = parseInt(match[1], 10);
                }
            }

            // 조건: 기준치 이상이고 제목이 유효할 때
            if (percent >= threshold && title && title !== '제목 없음') {
                // 중복 체크
                const exists = library.some(w => w.title === title && w.platform === platform);
                if (!exists) {
                    library.push({
                        id: Date.now().toString() + Math.random().toString(36).substr(2),
                        title: title,
                        platform: platform,
                        percent: percent
                    });
                    added++;
                } else {
                    skipped++;
                }
            }
        });

        if (added > 0) {
            saveToStorage();
            renderList();
            document.getElementById('htmlData').value = '';
            alert(`성공! ${added}개의 작품이 추가되었습니다. (중복/조건미달 제외: ${skipped}개)`);
        } else {
            alert(`추가된 작품이 없습니다. 이미 추가된 작품이거나 소장률 기준(${threshold}%)을 넘는 작품이 없습니다.`);
        }
    }

    function renderList() {
        const container = document.getElementById('libraryList');
        document.getElementById('totalCount').textContent = library.length;
        
        container.innerHTML = '';

        if (library.length === 0) {
            container.innerHTML = `<div style="padding: 24px; text-align: center; color: var(--text-muted);">서재가 비어있습니다. 작품을 추가해주세요.</div>`;
            return;
        }

        // 소장률 내림차순 정렬
        const sorted = [...library].sort((a, b) => b.percent - a.percent);

        sorted.forEach(item => {
            const div = document.createElement('div');
            div.className = 'list-item';
            
            // 보안을 위한 이스케이프 처리
            const safeTitle = escapeHTML(item.title);
            const safePlatform = escapeHTML(item.platform);

            div.innerHTML = `
                <div class="item-info">
                    <div class="item-title">${safeTitle}</div>
                    <div class="item-meta">
                        <span class="badge">${safePlatform}</span>
                        <span>소장률: <strong style="color: var(--primary);">${item.percent}%</strong></span>
                    </div>
                </div>
                <button class="danger btn-small" onclick="deleteItem('${item.id}')">삭제</button>
            `;
            container.appendChild(div);
        });
    }

    function deleteItem(id) {
        library = library.filter(item => item.id !== id);
        saveToStorage();
        renderList();
    }

    function clearAll() {
        if (library.length === 0) return;
        if (confirm('정말로 모든 작품을 삭제하시겠습니까?')) {
            library = [];
            saveToStorage();
            renderList();
            document.getElementById('rouletteResult').innerHTML = '<div style="color: var(--text-muted);">버튼을 눌러 운명의 작품을 뽑아보세요!</div>';
        }
    }

    function spinRoulette() {
        const filter = document.getElementById('filterPlatform').value;
        const resultBox = document.getElementById('rouletteResult');

        let pool = library;
        if (filter !== '전체') {
            pool = library.filter(item => item.platform === filter);
        }

        if (pool.length === 0) {
            resultBox.innerHTML = `<div style="color: var(--danger); font-weight: bold;">조건에 맞는 작품이 없습니다!</div>`;
            return;
        }

        // 애니메이션 효과
        let count = 0;
        const maxTicks = 15;
        const speed = 80;

        const interval = setInterval(() => {
            const randomPick = pool[Math.floor(Math.random() * pool.length)];
            resultBox.innerHTML = `
                <div class="roulette-meta" style="color: #9ca3af;">고르는 중...</div>
                <div class="roulette-title" style="color: #6b7280;">${escapeHTML(randomPick.title)}</div>
            `;
            
            count++;
            if (count >= maxTicks) {
                clearInterval(interval);
                // 최종 결정
                const finalPick = pool[Math.floor(Math.random() * pool.length)];
                resultBox.innerHTML = `
                    <div class="roulette-meta">오늘은 이 작품 어때요?</div>
                    <div class="roulette-title">${escapeHTML(finalPick.title)}</div>
                    <div class="roulette-meta">
                        <span class="badge" style="background-color:#fef3c7; border: 1px solid #d97706;">${escapeHTML(finalPick.platform)}</span> 
                        소장률 ${finalPick.percent}%
                    </div>
                `;
            }
        }, speed);
    }

    function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // 앱 시작 시 초기화
    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
