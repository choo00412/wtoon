<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹툰 서재 관리자</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 기본 폰트 설정 및 스크롤바 커스텀 */
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        
        .list-container {
            max-height: 500px;
            overflow-y: auto;
        }

        /* 룰렛 빗금 배경 패턴 */
        .roulette-bg {
            background-color: #fef3c7;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(245, 158, 11, 0.1) 10px, rgba(245, 158, 11, 0.1) 20px);
        }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8">

    <!-- 메인 컨테이너 -->
    <div class="max-w-3xl mx-auto">
        
        <div id="main-view" class="space-y-6 block">
            <!-- 메인 헤더 -->
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <h1 class="text-2xl font-extrabold text-gray-900">📚 내 웹툰 서재</h1>
                <button onclick="toggleView('management-view')" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-semibold transition-colors flex items-center gap-2">
                    <span>⚙️</span> 관리 및 추가
                </button>
            </div>

            <!-- 랜덤 정주행 룰렛 카드 -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold flex items-center gap-2">🎲 랜덤 정주행 룰렛</h2>
                </div>
                
                <div class="flex flex-col sm:flex-row gap-4 items-end mb-4">
                    <div class="flex-1 w-full">
                        <label for="rouletteFilter" class="block text-sm font-semibold text-gray-700 mb-2">추천받을 플랫폼</label>
                        <select id="rouletteFilter" class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="전체">전체 플랫폼</option>
                            <option value="레진코믹스">레진코믹스</option>
                            <option value="봄툰">봄툰</option>
                            <option value="리디">리디</option>
                            <option value="네이버웹툰">네이버웹툰</option>
                        </select>
                    </div>
                    <button onclick="spinRoulette()" class="w-full sm:w-auto bg-purple-600 hover:bg-purple-700 text-white font-bold px-8 py-3 rounded-lg transition-colors shadow-md">
                        랜덤 픽!
                    </button>
                </div>

                <div id="rouletteResult" class="roulette-bg border-2 border-dashed border-amber-500 rounded-xl p-8 text-center min-h-[180px] flex flex-col justify-center items-center transition-all">
                    <div class="text-gray-500 text-lg">버튼을 눌러 운명의 작품을 뽑아보세요!</div>
                </div>
            </div>

            <!-- 내 서재 리스트 카드 -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                    <h2 class="text-xl font-bold">
                        내 서재 리스트 (<span id="totalCount" class="text-purple-600">0</span>)
                    </h2>
                    
                    <!-- 플랫폼 필터 -->
                    <div class="flex items-center gap-3 w-full sm:w-auto">
                        <label for="listFilter" class="text-sm font-semibold text-gray-600 whitespace-nowrap">플랫폼 필터:</label>
                        <select id="listFilter" onchange="renderLibrary()" class="w-full sm:w-48 border border-gray-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="전체">전체 보기</option>
                            <option value="레진코믹스">레진코믹스</option>
                            <option value="봄툰">봄툰</option>
                            <option value="리디">리디</option>
                            <option value="네이버웹툰">네이버웹툰</option>
                        </select>
                    </div>
                </div>

                <div class="list-container border border-gray-200 rounded-xl overflow-hidden" id="libraryList">
                    <!-- 자바스크립트로 리스트 렌더링 -->
                </div>
            </div>
        </div>

        <div id="management-view" class="space-y-6 hidden">
            <!-- 관리 페이지 헤더 -->
            <div class="flex items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <button onclick="toggleView('main-view')" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg font-semibold transition-colors flex items-center gap-2">
                    <span>🔙</span> 메인으로
                </button>
                <h1 class="text-2xl font-extrabold text-gray-900">⚙️ 데이터 관리</h1>
            </div>

            <!-- 웹툰 불러오기 -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">1. 웹툰 불러오기</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2">플랫폼 선택</label>
                        <select class="w-full border border-gray-300 rounded-lg p-3">
                            <option>레진코믹스</option><option>봄툰</option><option>리디</option><option>네이버웹툰</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">입력 방식</label>
                        <select class="w-full border border-gray-300 rounded-lg p-3">
                            <option>HTML 코드</option><option>텍스트 목록</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">소장률 기준 (%)</label>
                        <input type="number" value="0" min="0" max="100" class="w-full border border-gray-300 rounded-lg p-3">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-2">내용 붙여넣기</label>
                    <textarea class="w-full border border-gray-300 rounded-lg p-3 h-32 font-mono text-sm" placeholder="내용을 붙여넣으세요..."></textarea>
                </div>
                <button onclick="showFeedback('importFeedback', '추가 기능은 현재 모형입니다.')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors">
                    서재에 추가하기
                </button>
                <div id="importFeedback" class="text-sm text-blue-600 mt-2 font-semibold h-5"></div>
            </div>

            <!-- 클라우드 동기화 -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">2. ☁️ 클라우드 동기화 (GitHub Gist)</h2>
                <p class="text-sm text-gray-500 mb-4">최초 1회 PC에서 "새 동기화 시작"으로 Gist를 만든 뒤, 같은 토큰과 ID를 폰에도 입력하면 됩니다.</p>
                <div class="space-y-4 mb-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2">GitHub Token</label>
                        <input type="password" placeholder="ghp_xxxxxxxxxxxx" class="w-full border border-gray-300 rounded-lg p-3">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Gist ID</label>
                        <input type="text" placeholder="Gist ID를 입력하세요" class="w-full border border-gray-300 rounded-lg p-3">
                    </div>
                </div>
                <div class="flex flex-col sm:flex-row gap-3">
                    <button class="flex-1 bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-lg">🆕 새 동기화 시작</button>
                    <button class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg">⬆️ 업로드</button>
                    <button class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-lg">⬇️ 가져오기</button>
                </div>
            </div>

            <!-- 로컬 백업 -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">3. 로컬 백업 (텍스트)</h2>
                <div class="mb-4">
                    <textarea class="w-full border border-gray-300 rounded-lg p-3 h-24 font-mono text-sm" placeholder="내 서재 데이터 (JSON)"></textarea>
                </div>
                <div class="flex flex-col sm:flex-row gap-3">
                    <button class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded-lg">📤 내보내기</button>
                    <button class="flex-1 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold py-3 rounded-lg">📥 병합하기</button>
                    <button class="flex-1 bg-red-100 hover:bg-red-200 text-red-800 font-bold py-3 rounded-lg">⚠️ 덮어쓰기</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 초기 Mock 데이터 (테스트용)
        let library = [
            { id: 1, title: "킬링 스토킹", platform: "레진코믹스", percentage: 100 },
            { id: 2, title: "야화첩", platform: "레진코믹스", percentage: 95 },
            { id: 3, title: "새벽, 구름, 강", platform: "봄툰", percentage: 80 },
            { id: 4, title: "귀태", platform: "봄툰", percentage: 100 },
            { id: 5, title: "상수리나무 아래", platform: "리디", percentage: 92 },
            { id: 6, title: "마귀", platform: "리디", percentage: 70 },
            { id: 7, title: "화산귀환", platform: "네이버웹툰", percentage: 99 },
            { id: 8, title: "바른연애 길잡이", platform: "네이버웹툰", percentage: 100 }
        ];

        // 페이지 뷰 토글 함수
        function toggleView(viewId) {
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('management-view').classList.add('hidden');
            
            document.getElementById(viewId).classList.remove('hidden');
            
            // 메인 뷰로 돌아올 때 리스트 갱신
            if(viewId === 'main-view') {
                renderLibrary();
            }
        }

        // 플랫폼에 따른 배지 색상 반환 함수 (요구사항 반영)
        function getPlatformColorClass(platform) {
            switch(platform) {
                case '레진코믹스': return 'bg-red-500 text-white';
                case '봄툰': return 'bg-pink-400 text-white';
                case '리디': return 'bg-sky-400 text-white';
                case '네이버웹툰': return 'bg-green-500 text-white';
                default: return 'bg-gray-200 text-gray-800'; // 기타 플랫폼
            }
        }

        // 서재 리스트 렌더링 함수
        function renderLibrary() {
            const container = document.getElementById('libraryList');
            const filterValue = document.getElementById('listFilter').value;
            
            container.innerHTML = ''; // 초기화

            // 필터링 적용
            const filteredData = filterValue === '전체' 
                ? library 
                : library.filter(item => item.platform === filterValue);

            document.getElementById('totalCount').innerText = filteredData.length;

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-gray-500 font-medium">
                        조건에 맞는 웹툰이 없습니다.
                    </div>`;
                return;
            }

            // 요구사항: 크게 보기 좋게, 번호 제거
            filteredData.forEach(item => {
                const colorClass = getPlatformColorClass(item.platform);
                
                const listItem = document.createElement('div');
                // 호버 효과 및 패딩 증가 (p-5), 폰트 크기 증가 (text-xl)
                listItem.className = 'flex flex-col sm:flex-row sm:justify-between sm:items-center p-5 border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors gap-2';
                
                listItem.innerHTML = `
                    <div class="font-extrabold text-xl text-gray-800 truncate">
                        ${item.title}
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                        <span class="px-3 py-1 rounded-md text-sm font-bold shadow-sm ${colorClass}">
                            ${item.platform}
                        </span>
                        <span class="text-gray-500 text-sm font-semibold whitespace-nowrap bg-gray-200 px-2 py-1 rounded-md">
                            소장: ${item.percentage}%
                        </span>
                    </div>
                `;
                container.appendChild(listItem);
            });
        }

        // 랜덤 정주행 룰렛 함수
        function spinRoulette() {
            const filterValue = document.getElementById('rouletteFilter').value;
            const resultBox = document.getElementById('rouletteResult');
            
            // 필터링된 후보군 설정
            const candidates = filterValue === '전체' 
                ? library 
                : library.filter(item => item.platform === filterValue);

            if (candidates.length === 0) {
                resultBox.innerHTML = '<div class="text-gray-600 font-bold text-lg">해당 플랫폼에 추천할 웹툰이 없습니다!</div>';
                return;
            }

            // 룰렛 이펙트 시작
            resultBox.innerHTML = '<div class="text-2xl font-black text-amber-600 animate-pulse">운명의 작품을 고르는 중... 🔮</div>';

            setTimeout(() => {
                // 랜덤 선택
                const randomIndex = Math.floor(Math.random() * candidates.length);
                const winner = candidates[randomIndex];
                const colorClass = getPlatformColorClass(winner.platform);

                // 결과 렌더링
                resultBox.innerHTML = `
                    <div class="mb-3 inline-block px-4 py-1 rounded-full text-sm font-bold shadow-sm ${colorClass} animate-bounce">
                        ${winner.platform}
                    </div>
                    <div class="text-4xl font-black text-amber-900 mb-3 break-keep w-full">
                        ${winner.title}
                    </div>
                    <div class="text-lg font-bold text-amber-700 bg-white px-4 py-1 rounded-full border border-amber-300 shadow-sm">
                        소장률: ${winner.percentage}%
                    </div>
                `;
            }, 800); // 0.8초 후 결과 표시
        }

        // 간단한 피드백 메시지 표시 (alert 대체)
        function showFeedback(elementId, message) {
            const el = document.getElementById(elementId);
            if(el) {
                el.innerText = message;
                setTimeout(() => el.innerText = '', 3000);
            }
        }

        // 앱 초기화: 렌더링
        window.onload = function() {
            renderLibrary();
        };
    </script>
</body>
</html>
